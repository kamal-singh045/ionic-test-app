<ion-button
  [ngClass]="buttonClasses"
  [disabled]="disabled || loading"
  [type]="type"
  [fill]="fill"
  (click)="handleClick()"
  >
    @if (iconStart) {
      <ion-icon slot="start" [name]="iconStart"></ion-icon>
    }
    {{title}}
    @if (loading) {
      <ion-spinner name="crescent"></ion-spinner>
    }
    @if (iconEnd) {
      <ion-icon slot="end" [name]="iconEnd"></ion-icon>
    }
</ion-button>
