<ion-header [translucent]="true">
  <ion-toolbar>
    @if (showBackButton) {
      <ion-buttons slot="start">
        <ion-button (click)="goBack()">
          <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
    <ion-title>{{title}}</ion-title>
  </ion-toolbar>
</ion-header>
