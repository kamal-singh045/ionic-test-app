<app-app-header title="Home"></app-app-header>

<ion-content [fullscreen]="true">
  <div id="container">
    <strong>Ready to create an app?</strong>

    <p>{{isLocationFetching ? 'Fetching Location' : 'Location Fetched'}}</p>

    <p>Notification Permission: {{isNotificationPermissionGranted}}</p>

    <p>Location: {{locationPosition?.coords?.latitude}}, {{locationPosition?.coords?.longitude}} </p>

    <ion-button class="gallery-redirect-btn" [routerLink]="['/tabs/gallery']">
      Go to gallery
    </ion-button>
  </div>
</ion-content>
