<app-app-header title="Gallery"></app-app-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="takePhoto()">
    Add Photo
  </ion-button>

  <ion-grid>
    <ion-row>
      @for (photo of photos; track photo) {
        <ion-col size="6">
          <ion-img [src]="photo"></ion-img>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
