<app-app-header title="Profile"></app-app-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>User Profile</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="profileForm">
        <ion-list>
          <!-- Name Field -->
          <app-theme-input
            label="Name"
            type="text"
            placeholder="Enter name"
            formControlName="name"
            [showError]="profileForm.controls['name'].dirty && profileForm.controls['name'].invalid"
            [error]="getError('name')"
          ></app-theme-input>

          <!-- Email Field -->
          <app-theme-input
            label="Email"
            type="email"
            placeholder="Enter email"
            formControlName="email"
            [showError]="profileForm.controls['email'].dirty && profileForm.controls['email'].invalid"
            [error]="getError('email')"
          ></app-theme-input>
          
          <!-- Phone Field -->
          <app-theme-input
            label="Phone"
            type="tel"
            placeholder="Enter phone number"
            formControlName="phone"
            [showError]="profileForm.controls['phone'].dirty && profileForm.controls['phone'].invalid"
            [error]="getError('phone')"
          ></app-theme-input>

          <!-- Designation Dropdown -->
          <ion-item>
            <ion-label position="stacked">Designation</ion-label>
            <ion-select
              formControlName="designation"
              placeholder="Select your designation"
              interface="popover"
              >
              @for (designation of designations; track designation) {
                <ion-select-option [value]="designation">{{designation}}</ion-select-option>
              }
            </ion-select>
          </ion-item>
          @if (hasError('designation', 'required')) {
            <div class="error-message">Designation is required</div>
          }
        </ion-list>

        <!-- Action Buttons -->
        <div class="button-container">
           @if (!isEditing) {
              <app-theme-button
                [title]="'Edit'"
                [variant]="'primary'"
                [fill]="'solid'"
                [size]="'md'"
                [iconStart]="'create-outline'"
                (handler)="enableEdit()"
              ></app-theme-button>
           } @else {
              <div class="edit-buttons">
                <app-theme-button
                  [title]="'Save'"
                  [variant]="'success'"
                  [iconStart]="'save-outline'"
                  (handler)="saveProfile()"
                  [disabled]="!profileForm.valid"
                ></app-theme-button>

                <app-theme-button
                  [title]="'Cancel'"
                  [variant]="'transparent'"
                  [fill]="'outline'"
                  iconStart="close-outline"
                  (handler)="cancelEdit()"
                ></app-theme-button>
              </div>
            }
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
