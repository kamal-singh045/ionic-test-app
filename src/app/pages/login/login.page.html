<ion-content [fullscreen]="true" class="ion-padding">
  <div class="flex items-center justify-center min-h-full">
    <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-md border">
      <h1 class="text-2xl font-bold mb-6 text-center">Login</h1>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Username -->

        <app-theme-input
          label="Username"
          placeholder="Enter username"
          type="string"
          formControlName="username"
          [showError]="loginForm.controls['username'].dirty && loginForm.controls['username'].invalid"
          [error]="getError('username')"
        ></app-theme-input>

        <!-- Password -->
        <app-theme-input
          label="Password"
          placeholder="Enter password"
          type="string"
          formControlName="password"
          [showError]="loginForm.controls['password'].dirty && loginForm.controls['password'].invalid"
          [error]="getError('password')"
        ></app-theme-input>

        @if (errorMessage) {
          <p class="text-red-500 text-sm">{{ errorMessage }}</p>
        }

        <app-theme-button
          [loading]="isLoading"
          title="Login"
          type="submit"
          class="mt-3"
        >
        </app-theme-button>
      </form>
    </div>
  </div>
</ion-content>
